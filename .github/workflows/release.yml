name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_TOKEN: ${{ secrets.KINEVOR_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  nuget:
    name: Publish NuGet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - name: Restore
        run: |
          cat > "$RUNNER_TEMP/nuget.ci.config" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
              <add key="github" value="https://nuget.pkg.github.com/SoftwareDeveloper98/index.json" />
            </packageSources>
            <packageSourceCredentials>
              <github>
                <add key="Username" value="SoftwareDeveloper98" />
                <add key="ClearTextPassword" value="${NUGET_TOKEN}" />
              </github>
            </packageSourceCredentials>
          </configuration>
          EOF
          dotnet restore backend/Kinevor.Modules.StaffDashboard.slnx \
            --configfile "$RUNNER_TEMP/nuget.ci.config"
      - name: Test
        run: dotnet test backend/Kinevor.Modules.StaffDashboard.slnx -c Release --no-restore
      - name: Pack
        run: |
          dotnet pack backend/src/Kinevor.Modules.StaffDashboard/Kinevor.Modules.StaffDashboard.csproj \
            -c Release --no-build -o backend/artifacts/packages
          dotnet pack backend/src/Kinevor.Modules.StaffDashboard.EntityFrameworkCore/Kinevor.Modules.StaffDashboard.EntityFrameworkCore.csproj \
            -c Release --no-build -o backend/artifacts/packages
      - name: Push
        run: >
          dotnet nuget push "backend/artifacts/packages/*.nupkg"
          --source "https://nuget.pkg.github.com/SoftwareDeveloper98/index.json"
          --api-key "$NUGET_TOKEN" --skip-duplicate
      - name: Push symbols
        run: >
          dotnet nuget push "backend/artifacts/packages/*.snupkg"
          --source "https://nuget.pkg.github.com/SoftwareDeveloper98/index.json"
          --api-key "$NUGET_TOKEN" --skip-duplicate

  npm:
    name: Publish npm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NODE_AUTH_TOKEN: ${{ secrets.KINEVOR_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Authenticate GitHub Packages
        run: npm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Publish
        run: >
          npm publish ./dist/kinevor-staff-dashboard
          --registry=https://npm.pkg.github.com --access restricted
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  mobile:
    name: Publish Flutter source
    runs-on: ubuntu-latest
    needs: npm
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Install
        working-directory: mobile/packages/kinevor_staff_dashboard
        run: flutter pub get
      - name: Format
        working-directory: mobile/packages/kinevor_staff_dashboard
        run: dart format --output=none --set-exit-if-changed lib test example/lib
      - name: Analyze
        working-directory: mobile/packages/kinevor_staff_dashboard
        run: flutter analyze
      - name: Read version
        id: version
        working-directory: mobile/packages/kinevor_staff_dashboard
        shell: bash
        run: |
          version="$(sed -n 's/^version: *//p' pubspec.yaml | head -n1)"
          if [ -z "$version" ]; then
            echo "No version found in pubspec.yaml." >&2
            exit 1
          fi
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Archive package
        working-directory: .
        shell: bash
        run: >
          tar --exclude=.dart_tool --exclude=build --exclude='*/build'
          -czf "kinevor_staff_dashboard-${{ steps.version.outputs.version }}.tar.gz"
          -C mobile/packages kinevor_staff_dashboard
      - name: Checksum
        working-directory: .
        shell: bash
        run: >
          sha256sum
          "kinevor_staff_dashboard-${{ steps.version.outputs.version }}.tar.gz" >
          "kinevor_staff_dashboard-${{ steps.version.outputs.version }}.tar.gz.sha256"
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            kinevor_staff_dashboard-${{ steps.version.outputs.version }}.tar.gz
            kinevor_staff_dashboard-${{ steps.version.outputs.version }}.tar.gz.sha256
